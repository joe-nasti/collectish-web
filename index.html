<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f8ff">
  <script>
    (function(){
      try{
        var p=new URL(location.href).searchParams;
        var scoutTarget=['sku','product','card','fromCard'].some(function(k){return p.has(k)});
        var android=/Android/i.test(navigator.userAgent||'');
        var nativeHost=p.get('nativeHost')==='1';
        var webFallback=p.get('webFallback')==='1';
        if(android&&scoutTarget&&!nativeHost&&!webFallback&&!/\/open\.html$/.test(location.pathname)){
          location.replace(new URL('./open.html'+location.search,location.href).toString());
        }
      }catch(_){}
    })();
  </script>
  <link rel="manifest" href="./assets/manifest.CUPQq0zW.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/collectish-icon-192.CmWzr2KN.png">
  <title>Collectish</title>
  <style>
    #collectishBootFallback{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f8ff;color:#0b1538;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #collectishBootFallback>div{width:min(360px,100%);text-align:center;padding:24px;border-radius:18px;background:#fff;border:1px solid #d9e3f1;box-shadow:0 10px 30px rgba(11,21,56,.08)}
    #collectishBootFallback strong{display:block;font-size:28px;letter-spacing:-1px}#collectishBootFallback span,#collectishBootFallback small{display:block;margin-top:8px;color:#64718b;font-size:13px;word-break:break-word}
  </style>
  <script>
    (function(){
      window.__collectishBootErrors=[];
      function remember(msg){
        window.__collectishBootErrors.push(String(msg||'unknown error'));
        if(window.__collectishBootErrors.length>8)window.__collectishBootErrors=window.__collectishBootErrors.slice(-8);
      }
      window.addEventListener('error',function(e){remember(e.message||e.error||('resource failed: '+(e.target&&e.target.src||e.target&&e.target.href||'unknown')))},true);
      window.addEventListener('unhandledrejection',function(e){remember(e.reason&&e.reason.message||e.reason||'unhandled rejection')});
      window.setTimeout(function(){
        var host=document.getElementById('collectishBootFallback'); if(!host)return;
        var span=host.querySelector('span'); if(span)span.textContent='Startup has not completed.';
        var d=host.querySelector('div'); if(!d)return;
        var details=document.createElement('small');
        details.id='collectishBootDiagnostic';
        details.textContent=(window.__collectishBootErrors.length?window.__collectishBootErrors.join(' | '):'No JavaScript error surfaced')+' · '+location.pathname+location.search+' · '+navigator.userAgent;
        d.appendChild(details);
      },7000);
    })();
  </script>
  <script type="module" crossorigin src="./assets/index.CT5KUFae.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index.DfyV2Lgl.css">

  <meta name="collectish-revision" content="r974">
</head>
<body>
  <main id="collectishBootFallback"><div><strong>collectish</strong><span>Loading Collectish…</span></div></main>
  <noscript>Collectish requires JavaScript.</noscript>
</body>
</html>
