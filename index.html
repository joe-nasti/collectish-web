  <script>
    (function(){
      try{
        var p=new URL(location.href).searchParams;
        var scoutTarget=['sku','product','card','fromCard'].some(function(k){return p.has(k)});
        var android=/Android/i.test(navigator.userAgent||'');
        var nativeHost=p.get('nativeHost')==='1';
        var webFallback=p.get('webFallback')==='1';
        if(android&&scoutTarget&&!nativeHost&&!webFallback&&!/\/open\.html$/.test(location.pathname)){
          location.replace(new URL('./open.html'+location.search,location.href).toString());
        }
      }catch(_){}
    })();

  <script>
    (function(){
      window.__collectishBootErrors=[];
      function remember(msg){
        window.__collectishBootErrors.push(String(msg||'unknown error'));
        if(window.__collectishBootErrors.length>8)window.__collectishBootErrors=window.__collectishBootErrors.slice(-8);
      }
      var retryScheduled=false;
      function retryUrl(){var url=new URL(location.href);url.searchParams.set('_boot_retry',String(Date.now()));return url.toString()}
      function recoverAsset(target){
        if(retryScheduled||new URL(location.href).searchParams.has('_boot_retry'))return;
        if(!target||!['SCRIPT','LINK'].includes(target.tagName))return;
        var asset;try{asset=new URL(target.src||target.href,location.href)}catch(_){return}
        if(asset.origin!==location.origin||!(/\.(?:js|mjs|css)$/i).test(asset.pathname))return;
        retryScheduled=true;
        window.setTimeout(function(){
          if(!document.getElementById('collectishBootFallback'))return;
          location.replace(retryUrl());
        },250);
      }
      window.addEventListener('error',function(e){remember(e.message||e.error||('resource failed: '+(e.target&&e.target.src||e.target&&e.target.href||'unknown')));recoverAsset(e.target)},true);
      window.addEventListener('unhandledrejection',function(e){remember(e.reason&&e.reason.message||e.reason||'unhandled rejection')});
      window.setTimeout(function(){
        var host=document.getElementById('collectishBootFallback'); if(!host)return;
        var span=host.querySelector('span'); if(span)span.textContent='Collectish could not finish loading. Reload to try again; your saved sign-in will be kept.';
        var d=host.querySelector('div'); if(!d)return;
        var button=document.createElement('button');button.type='button';button.textContent='Reload Collectish';button.onclick=function(){location.replace(retryUrl())};d.appendChild(button);
        var disclosure=document.createElement('details'),summary=document.createElement('summary');summary.textContent='Technical details';disclosure.appendChild(summary);
        var details=document.createElement('small');
        details.id='collectishBootDiagnostic';
        details.textContent=(window.__collectishBootErrors.length?window.__collectishBootErrors.join(' | '):'No JavaScript error surfaced')+' · '+location.pathname+location.search+' · '+navigator.userAgent;
        disclosure.appendChild(details);d.appendChild(disclosure);
      },7000);
    })();
  </script>
